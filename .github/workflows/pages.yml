name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/generate-icons.py
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: /flight-bag/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # deploy-pages 404s until Settings → Pages → Source is GitHub Actions.
  # GITHUB_TOKEN cannot create the Pages site. Skip deploy until has_pages
  # so the workflow stays green and failure emails stop.
  deploy:
    if: github.event.repository.has_pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
